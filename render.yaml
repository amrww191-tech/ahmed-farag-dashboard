services:
  - type: web
    name: ahmed-farag-pro-bot
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements_bot.txt
    startCommand: python telegram_bot.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: PORT
        value: "8080"
